plugins {
    id 'com.android.application'
}

android {
    namespace 'app.openring'
    compileSdk 34

    defaultConfig {
        applicationId 'app.openring'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '1.12'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signs release builds with the debug key so "assembleRelease" gives an installable APK.
            // Replace with your own signingConfig if you distribute the app.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No third party dependencies: the app uses only the Android framework.
