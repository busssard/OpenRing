plugins {
    id 'com.android.application'
}

// The version is counted from the change notes in changes/ (same rule as tools/version.sh)
def changeNotes = (new File(rootDir, 'changes').listFiles() ?: []).findAll { it.name ==~ /[0-9].*\.md/ }.size()
def appVersionCode = 29 + changeNotes
def appVersionName = '1.' + (28 + changeNotes)

android {
    namespace 'app.openring'
    compileSdk 34

    defaultConfig {
        applicationId 'app.openring'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signs release builds with the debug key so "assembleRelease" gives an installable APK.
            // Replace with your own signingConfig if you distribute the app.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No third party dependencies: the app uses only the Android framework.
