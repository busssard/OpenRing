plugins {
    id 'com.android.application'
}

// The version comes from tools/version.sh (change notes in changes/ and the release tags), the same as
// build_apk.sh. Without a shell it falls back to the code from the notes and the name "2.local".
def changeNotes = (new File(rootDir, 'changes').listFiles() ?: []).findAll { it.name ==~ /[0-9].*\.md/ }.size()
def appVersionCode = 29 + changeNotes
def appVersionName = '2.local'
try {
    def out = ['sh', new File(rootDir, 'tools/version.sh').path].execute().text.trim().split(' ')
    if (out.length == 2 && out[0].isInteger()) { appVersionCode = out[0].toInteger(); appVersionName = out[1] }
} catch (Exception ignored) { }

android {
    namespace 'app.openring'
    compileSdk 34

    defaultConfig {
        applicationId 'app.openring'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signs release builds with the debug key so "assembleRelease" gives an installable APK.
            // Replace with your own signingConfig if you distribute the app.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No third party dependencies: the app uses only the Android framework.
