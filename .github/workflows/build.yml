name: Build APK
# Every push and pull request: run the tests and build an APK you can download from the run.
# Push to main with a version that has no release yet: build with the private signing key and
# publish the GitHub Release vX.Y automatically (so merging a version bump is all it takes).
# A tag vX.Y made by hand (or by "Draft a new release" on GitHub) gets the signed APK attached.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core tests
        run: ./tests/run_tests.sh
      - name: End to end pipeline test
        run: ./tests/run_pipeline.sh
      - name: Signing key from the repository secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signing with the release key"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::error::KEYSTORE_B64 secret missing: releases must be signed with the release key"
            exit 1
          else
            echo "no KEYSTORE_B64 secret (pull request from a fork?): building with a throwaway key"
          fi
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: ./build_apk.sh
      - name: Privacy check (no internet permission, no tracking code)
        run: ./tests/check_privacy.sh
      - name: Name the APK after its version
        run: |
          v=$(sed -n 's/^VERSION_NAME=//p' build_apk.sh)
          cp build/OpenRing.apk "build/OpenRing-$v.apk"
          echo "APK=build/OpenRing-$v.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRing-apk
          path: ${{ env.APK }}
      - name: Is this a new release?
        id: rel
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^VERSION_NAME=//p' build_apk.sh)
          if [ "$GITHUB_REF_TYPE" = "tag" ] || ! gh release view "v$v" >/dev/null 2>&1; then echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Prove where the APK came from (build provenance)
        if: steps.rel.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.APK }}
      - name: Publish the release
        if: steps.rel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^VERSION_NAME=//p' build_apk.sh)
          tag="v$v"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME but app version $v"; exit 1
          fi
          # release notes: this version's section of the changelog
          awk -v h="## $v" '$0==h{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Open Ring $v" > notes.md
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          cert=$("$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          cat >> notes.md <<NOTES

          ### Install
          Download **$(basename "$APK")** on your Android phone and open it. Step by step help, including the
          "Install anyway" screen: [README, Install](https://github.com/${GITHUB_REPOSITORY}#install).

          ### Check this download
          * Built by GitHub Actions from commit [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) in [this run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), after all tests and the privacy check passed.
          * SHA-256 of the APK: \`$sha\`
          * Signing certificate SHA-256: \`$cert\` (the same for every release; Android refuses updates signed by anyone else)
          * Verify the build provenance: \`gh attestation verify $(basename "$APK") -R ${GITHUB_REPOSITORY}\`
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              gh release upload "$tag" "$APK" --clobber
            else
              echo "release $tag already exists; bump the version to publish a new one"
            fi
          else
            gh release create "$tag" "$APK" --target "$GITHUB_SHA" --title "Open Ring $v" --notes-file notes.md
          fi
