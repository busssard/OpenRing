name: CodeQL security scan
# GitHub's code scanner looks for security problems in the Java code on every change and weekly.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the real build (javac via build_apk.sh, no Gradle), so CodeQL sees the compiled code with the
      # Android classes resolved instead of guessing from the source files
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build
        run: ./build_apk.sh
      - uses: github/codeql-action/analyze@v4
