name: Android emulator test
# Installs the app on a real Android 14 emulator, opens every screen with demo data, fails on any
# crash, and keeps the screenshots: on main they become the README pictures (branch "screenshots"),
# for pull requests they go to "screenshots-preview" so changes can be looked at before merging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: ./build_apk.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: OUT=screenshots ./.github/scripts/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
      - name: Publish the screenshots
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          branch=screenshots-preview
          [ "$GITHUB_REF" = "refs/heads/main" ] && branch=screenshots
          cd screenshots
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          src="${{ github.event.pull_request.head.sha || github.sha }}"
          git commit -q -m "Screenshots from ${src::7} (demo data)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
