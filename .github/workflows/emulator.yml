name: Android emulator test
# Installs the app on a real Android 14 emulator, opens every screen with demo data, fails on any
# crash, and keeps the screenshots: on main they become the README pictures (branch "screenshots"),
# for pull requests they go to "screenshots-preview" (folder pr-<number>) so changes can be looked at before merging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screens:
    runs-on: ubuntu-latest
    # The emulator step now takes 16 to 20 minutes (more screens); 20 for the whole job cancelled green runs
    # (#324). The emulator and the publish step have limits of their own; the job limit is the sum plus setup.
    timeout-minutes: 40
    env:
      # tools/version.sh, as in build.yml: the Settings screenshot shows the same version as the release
      VERSION_CHANNEL: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && 'stable' || 'nightly' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tools/version.sh reads the release tags v2.<y>
      - name: Does this change reach the screens?
        # owner, 17 November: the checks ran out of GitHub's minutes. A pull request that changes nothing the app is built
        # from (only docs, tests, change notes or other workflows) skips the 20 minute emulator run; the check still
        # passes, so it can be merged. Pushes to main and runs by hand always run.
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BASE" ]; then
            files=$(git diff --name-only "$BASE...HEAD")
            echo "$files"
            if ! echo "$files" | grep -qE '^(app/|tools/|build_apk\.sh$|\.github/scripts/screens\.sh$|\.github/workflows/emulator\.yml$)'; then
              run=false
              echo "::notice::No app or screen script change: the emulator run is skipped"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Screenshots badge, generating
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/badge.sh screenshots screenshots generating yellow
      - uses: actions/setup-java@v5
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        if: steps.scope.outputs.run == 'true'
        run: ./build_apk.sh
      - name: Enable KVM
        if: steps.scope.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 30   # screens.sh limits every adb call (issue #278)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 360   # fail after 6 minutes instead of 10 when the emulator does not start (issue #278)
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: OUT=screenshots ./.github/scripts/screens.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: screenshots
          path: screenshots
      # README pictures (main) only from a clean run; previews for pull requests also when it failed.
      # Each pull request gets its own folder pr-<number> on screenshots-preview (the root holds the
      # latest run); a lost race with another pull request is retried, a preview never turns the check
      # red, and without screenshots (the emulator failed first) the step does nothing (issue #57).
      - name: Publish the screenshots
        timeout-minutes: 5    # a slow publish only warns, the screens decide the check (#324)
        continue-on-error: true
        if: steps.scope.outputs.run == 'true' && (success() || (failure() && github.event_name == 'pull_request')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then export BRANCH=screenshots FOLDER=
          elif [ -n "$PR_NUMBER" ]; then export BRANCH=screenshots-preview FOLDER="pr-$PR_NUMBER"
          else export BRANCH=screenshots-preview FOLDER="branch-${GITHUB_REF_NAME//\//-}" SOURCE_BRANCH="$GITHUB_REF_NAME"
          fi
          SRC=screenshots REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .github/scripts/publish_screens.sh
      - name: Screenshots badge, result
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            .github/scripts/badge.sh screenshots screenshots "up to date (${GITHUB_SHA::7})" brightgreen
          else
            .github/scripts/badge.sh screenshots screenshots "failed, showing older" red
          fi
